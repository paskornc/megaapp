<script>
/* โหมดเว็บทั่วไป (GitHub Pages): ไม่มี Claude runtime จึงเก็บข้อมูลใน localStorage ของเบราว์เซอร์ และให้ดาวน์โหลดไฟล์ผ่านเบราว์เซอร์โดยตรง */
window.claude=window.claude||{use:async function(n){
  if(n==="downloads")return{save:async function(o){
    var b=new Blob([o.data],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}};
  return null}};
</script>
<title>สมุดลูกหนี้</title>

<style>
/* Layout: ledger-style workspace. Sticky header with month switcher, three tabs, one table-first main column; detail opens as a side sheet. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --line:#d5dbe2;
  --fg:#17202a; --muted:#5b6876; --accent:#0b6b73; --accent-fg:#ffffff; --accent-soft:#d9eef0;
  --good:#1c7a4a; --good-soft:#dcf1e4; --warn:#9a5b00; --warn-soft:#fbecc9; --bad:#b3261e; --bad-soft:#fadcd9;
  --f-display:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Noto Sans Thai","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#0f151b; --surface:#171f27; --surface-2:#202a34; --line:#2c3844;
  --fg:#e7ecf1; --muted:#9aa8b6; --accent:#4bb8c1; --accent-fg:#06262a; --accent-soft:#12383c;
  --good:#5fcf92; --good-soft:#143323; --warn:#f0b955; --warn-soft:#3a2c0e; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#171f27; --surface-2:#202a34; --line:#2c3844;
  --fg:#e7ecf1; --muted:#9aa8b6; --accent:#4bb8c1; --accent-fg:#06262a; --accent-soft:#12383c;
  --good:#5fcf92; --good-soft:#143323; --warn:#f0b955; --warn-soft:#3a2c0e; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}
:root[data-theme="midnight"]{--bg:#0b1020;--surface:#131a2e;--surface-2:#1b2440;--line:#2a3556;--fg:#e8ecf8;--muted:#9aa6c8;--accent:#7c9cff;--accent-fg:#0b1020;--accent-soft:#1c2850;--good:#5fd39b;--good-soft:#12342a;--warn:#f2c14e;--warn-soft:#3a300f;--bad:#ff8d8d;--bad-soft:#3d1a1d;color-scheme:dark}
:root[data-theme="indigo"]{--bg:#f2f3fa;--surface:#ffffff;--surface-2:#e8eaf6;--line:#d3d7ec;--fg:#1b1f3b;--muted:#5c6389;--accent:#3f4fc5;--accent-fg:#ffffff;--accent-soft:#e0e4fb;--good:#1c7a4a;--good-soft:#dcf1e4;--warn:#9a5b00;--warn-soft:#fbecc9;--bad:#b3261e;--bad-soft:#fadcd9;color-scheme:light}
:root[data-theme="sunset"]{--bg:#fbf3ea;--surface:#fffaf4;--surface-2:#f4e6d6;--line:#e5d2bc;--fg:#3a2618;--muted:#7d6450;--accent:#c2571a;--accent-fg:#ffffff;--accent-soft:#fbe2cf;--good:#2d7a3e;--good-soft:#dcf0de;--warn:#8f5a00;--warn-soft:#fbe8bd;--bad:#b3261e;--bad-soft:#fadcd9;color-scheme:light}
:root[data-theme="sakura"]{--bg:#fdf2f6;--surface:#ffffff;--surface-2:#f9e3ec;--line:#efcddb;--fg:#3a1d2b;--muted:#86596d;--accent:#c43d78;--accent-fg:#ffffff;--accent-soft:#fbdde9;--good:#1f7a52;--good-soft:#dcf1e6;--warn:#965a00;--warn-soft:#fbecc9;--bad:#b3261e;--bad-soft:#fadcd9;color-scheme:light}
.thm{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;cursor:pointer;color:var(--fg)}
.thm.on{border-color:var(--accent)}
.thm b{font:600 15px var(--f-display)}
.thm small{grid-column:1;color:var(--muted);font-size:12.5px}
.thm .dots{grid-row:1/3;grid-column:2;display:flex;gap:4px}
.thm .dots i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.qcard .qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qcard .qh b{font:600 15px var(--f-display)}
.qcard .qh .gear{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer;font-size:13px}
.qbar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:99px;background:var(--q,var(--good));transition:width .25s}
.qnum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px}
.qnum b{font-family:var(--f-num);font-weight:500}
.qsub{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.qsub b{font-family:var(--f-num);font-weight:500;color:var(--fg)}
.qoff{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--muted);font-size:14px}
.cbtn.ex{border-color:var(--bad);background:var(--bad-soft)}
.pie{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:16px}
.pie svg{width:190px;height:190px;flex:none}
.pie path,.pie circle{stroke:var(--surface);stroke-width:1.5;cursor:pointer}
.pie .lg{flex:1 1 200px;min-width:0;display:grid;gap:8px}
.pie .lg div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.pie .lg i{width:11px;height:11px;border-radius:3px;flex:none}
.pie .lg span{margin-left:auto;font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.pinfo{padding:0 16px 14px;font-size:13.5px;color:var(--muted);min-height:36px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--f-body);margin:0;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
h1{font:700 20px/1.2 var(--f-display);margin:0;margin-right:auto}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.month b{font:600 15px var(--f-display);min-width:112px;text-align:center}
.ibtn{border:0;background:transparent;width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:18px;line-height:1}
.ibtn:hover{background:var(--surface-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:10px 14px;font:600 14px var(--f-display);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:grid;gap:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.go{background:var(--good);border-color:var(--good);color:var(--accent-fg);font-weight:600}
.btn.go:hover{background:var(--good);filter:brightness(1.08)}
.clearbar{display:flex;gap:8px;margin:0 0 6px}
.clearbar .btn.go{flex:1;min-height:46px}
.btn.sm{padding:4px 10px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel>h2{font:600 15px var(--f-display);margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel>h2 small{font:400 13px var(--f-body);color:var(--muted);margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.stat b{display:block;font:500 22px/1.3 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.hot b{color:var(--bad)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-paid{background:var(--good-soft);color:var(--good)}
.p-soon,.p-part{background:var(--warn-soft);color:var(--warn)}
.p-late{background:var(--bad-soft);color:var(--bad)}
.p-wait{background:var(--surface-2);color:var(--muted)}
.alert-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-top:1px solid var(--line)}
.alert-row:first-of-type{border-top:0}
.alert-row .who{font-weight:600;min-width:120px;flex:1 1 140px}
.alert-row .acts{display:flex;gap:6px;flex-wrap:wrap}
.group-h{padding:8px 16px;font:600 12px var(--f-display);letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.empty{padding:18px 16px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=search]{flex:1 1 200px;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 12px var(--f-display);color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.03em}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0}
td.note{color:var(--muted);font-size:13px;max-width:260px}
.name{font-weight:600}
.sheet-back{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;border-left:1px solid var(--line)}
.sheet h2{font:700 18px var(--f-display);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sheet h2 button{margin-left:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.form .tog{display:flex;gap:8px;align-items:center}
.form .tog input{width:auto}
.sec{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.sec h3{font:600 14px var(--f-display);margin:0 0 8px}
.pay{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.pay .num{min-width:80px}
.pay span:nth-child(3){flex:1 1 100px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;max-width:90vw;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b1{fill:var(--surface-2);stroke:var(--line)}
.chart .b2{fill:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);padding:0 16px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.cols>*{min-width:0}
.hint{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:8px}
.thumb{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);padding:0;cursor:pointer}
.thumb img,.slip img{width:100%;height:100%;object-fit:cover;display:block}
.slip{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0;cursor:pointer;background:var(--surface-2)}
#lightbox .sheet-back{z-index:55;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
#lightbox img{max-width:100%;max-height:76vh;border-radius:8px;background:var(--surface)}
#lightbox .lbbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;color:#fff}
#lightbox .lbbar a{text-decoration:none;color:var(--fg)}
textarea.copybox{min-height:120px}
/* ---- หน้าต่างรายละเอียดลูกหนี้ (ออกแบบใหม่) ---- */
.sheet.sh2{width:min(520px,100%);padding:0;display:flex;flex-direction:column;overflow:hidden}
.sh-top{flex:none;padding:max(16px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 12px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:grid;gap:14px}
.sh-title{display:flex;align-items:flex-start;gap:12px}
.sh-title>div{min-width:0;flex:1}
.sh2 h2{font:700 22px/1.25 var(--f-display);margin:0;display:block;overflow-wrap:anywhere}
.sh-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:13px;color:var(--muted)}
.sh-close{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.sh-close:hover{background:var(--surface-2)}
.sh-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font:500 17px/1.35 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.hot b{color:var(--bad)}
.sh-top .clearbar{margin:0}
.sh-top .clearbar .btn.go{min-height:50px;font-size:16px}
.sh-top .seg button{min-height:42px;font-size:14px}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:18px;align-content:start}
.sh-body>[data-pane]{display:grid;gap:18px;align-content:start;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
.card>h3{font:600 16px var(--f-display);margin:0}
.card .form{gap:16px 14px}
.card .form label{font-size:13px;gap:6px}
.card input:not([type=checkbox]),.card select{min-height:46px}
.card textarea{min-height:84px}
.card .form .tog{min-height:46px}
.btn.block{width:100%;min-height:50px;font-size:16px;font-weight:600}
.early{border:1px dashed var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
.early>summary{cursor:pointer;font-weight:600;font-size:14px;min-height:46px;display:flex;align-items:center}
.early[open]>summary{border-bottom:1px solid var(--line);margin-bottom:14px}
details.keys{margin:0 16px 12px;font-size:12.5px;color:var(--muted)}
details.keys>summary{cursor:pointer}
details.keys>summary .hint{margin-left:6px}
.guide{display:flex;flex-direction:column;gap:6px;margin:12px 0 0;transition:opacity .2s ease,transform .2s ease}
.guide.fading{opacity:0;transform:translateY(-4px);pointer-events:none}
.guide .g{transition:opacity .18s ease,transform .18s ease}
.guide .g.out{opacity:0;transform:translateX(8px)}
.guide .ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:0 4px}
.guide .g{display:flex;align-items:flex-start;gap:8px;padding:9px 8px 9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;line-height:1.45}
.guide .g .gi{flex:0 0 18px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent-fg);background:var(--muted);margin-top:1px}
.guide .g .gt{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;padding:0;color:var(--fg);font:inherit;line-height:1.45;cursor:pointer}
.guide .g.bad{border-color:var(--bad);background:var(--bad-soft)}
.guide .g.bad .gi{background:var(--bad)}
.guide .g.warn{border-color:var(--warn);background:var(--warn-soft)}
.guide .g.warn .gi{background:var(--warn)}
.guide .g.good{border-color:var(--good);background:var(--good-soft)}
.guide .g.good .gi{background:var(--good)}
.guide .gx{background:none;border:0;color:var(--muted);font-size:15px;line-height:1;padding:2px 5px;cursor:pointer;border-radius:8px}
.guide .gx:hover{background:var(--surface-2);color:var(--fg)}
.guide .gmore{align-self:flex-start;font-size:12px;color:var(--muted);background:none;border:0;padding:2px 4px;cursor:pointer;text-decoration:underline}
.gbadge{display:inline-flex;align-items:center;gap:4px;height:32px;min-width:34px;justify-content:center;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
.gbadge[hidden]{display:none}
.gbadge.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.gbadge.open{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.early .form{margin-bottom:12px}
.early>p,.early>button{margin:0 0 14px}
.etag{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:0}
.ph{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.ph:last-child{border-bottom:0;padding-bottom:0}
.ph:first-child{padding-top:0}
.ph-main{flex:1 1 150px;min-width:0}
.ph-main b{font:500 18px var(--f-num);font-variant-numeric:tabular-nums;display:block}
.ph-main .hint{margin-top:2px;overflow-wrap:anywhere}
.ph-act{display:flex;align-items:center;gap:8px}

<script>
(function(){
"use strict";
/* ล็อกหน้าจอ: ไม่ให้ซูมด้วยนิ้ว (pinch) หรือ ctrl+ล้อเมาส์ */
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
const TH_M=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_S=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString("en-US",{maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,"0");
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const ymOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const ymParts=ym=>ym.split("-").map(Number);
const ymAdd=(ym,n)=>{const[y,m]=ymParts(ym);const d=new Date(y,m-1+n,1);return ymOf(d)};
const ymLabel=ym=>{const[y,m]=ymParts(ym);return TH_M[m-1]+" "+(y+543)};
const dueDate=(ym,day)=>{const[y,m]=ymParts(ym);const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(Math.max(1,day||1),last))};
const thDate=d=>d.getDate()+" "+TH_S[d.getMonth()]+" "+(d.getFullYear()+543);
const isoToTh=s=>{if(!s)return"-";const[y,m,d]=s.split("-").map(Number);return d+" "+TH_S[m-1]+" "+(y+543)};
const todayIso=()=>{const t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
const uid=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- ธีม ---------- */
const THEMES=[["","มิ้นต์","เขียวมิ้นต์ ตามโหมดสว่าง/มืดของเครื่อง",["#f3f5f7","#ffffff","#0b6b73","#1c7a4a","#b3261e"]],
["midnight","ค่ำคืน","โทนมืดน้ำเงินเข้ม สบายตาตอนกลางคืน",["#0b1020","#131a2e","#7c9cff","#5fd39b","#ff8d8d"]],
["indigo","ครามคลาสสิก","โทนสว่าง น้ำเงินครามทางการ",["#f2f3fa","#ffffff","#3f4fc5","#1c7a4a","#b3261e"]],
["sunset","พระอาทิตย์ตก","โทนครีมอุ่น ส้มอิฐ",["#fbf3ea","#fffaf4","#c2571a","#2d7a3e","#b3261e"]],
["sakura","ซากุระ","โทนชมพูอ่อน หวาน ๆ",["#fdf2f6","#ffffff","#c43d78","#1f7a52","#b3261e"]]];
const platTheme=document.documentElement.getAttribute("data-theme");
function applyTheme(t){const r=document.documentElement;if(t&&THEMES.some(x=>x[0]===t))r.setAttribute("data-theme",t);else if(platTheme)r.setAttribute("data-theme",platTheme);else r.removeAttribute("data-theme")}
let theme="";try{theme=localStorage.getItem("debt-theme")||""}catch(e){}
applyTheme(theme);
let uiSeeded=false;
/* กันไม่ให้ระบบข้างนอกเขียนทับธีมที่เลือกไว้ */
try{new MutationObserver(()=>{if(theme&&document.documentElement.getAttribute("data-theme")!==theme&&THEMES.some(x=>x[0]===theme))document.documentElement.setAttribute("data-theme",theme)}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}
function saveTheme(){
  try{localStorage.setItem("debt-theme",theme)}catch(e){}
  if(mode==="db"&&scol){scol.doc("ui").set({theme}).catch(()=>toast("บันทึกธีมลงบัญชีไม่สำเร็จ"))}
}
function themeFromDb(ui){
  if(ui&&typeof ui.theme==="string"){
    if(ui.theme!==theme){theme=ui.theme;try{localStorage.setItem("debt-theme",theme)}catch(e){}applyTheme(theme)}
  }else if(theme&&!uiSeeded){uiSeeded=true;saveTheme()}
}
function openTheme(){
  $("#overlay").innerHTML=`<div class="sheet-back" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="ธีม"><h2>เลือกธีม<button class="btn sm" data-act="closeSheet">ปิด</button></h2><div class="cform">${THEMES.map(t=>`<button type="button" class="thm${t[0]===theme?" on":""}" data-act="theme" data-t="${t[0]}"><b>${t[1]}</b><small>${t[2]}</small><span class="dots">${t[3].map(c=>`<i style="background:${c}"></i>`).join("")}</span></button>`).join("")}<p class="hint" style="margin:0">ระบบจำธีมล่าสุดไว้ในบัญชีของคุณ เปิดครั้งหน้าและเครื่องอื่นจะใช้ธีมเดียวกัน</p></div></div></div>`;
}

/* ---------- state ---------- */
let sampleFn=null,mcpNs=null;let debtors=[];let loaded=false;let mode="local";let col=null;let assets=null;
let ym=ymOf(new Date());let tab="home";let q="";let filter="all";let vmode="item";let accounts=[];let acol=null;
try{const t=localStorage.getItem("debt-tab");if(t)tab=t}catch(e){}
let area="debt",ctab="day",cwf="all",crk="expense";
try{area=(v=>v==="cash"||v==="inv"?v:"debt")(localStorage.getItem("debt-area"));const ct=localStorage.getItem("debt-ctab");if(ct)ctab=ct}catch(e){}
let cashtx=[],cashcats={},csettings={},ccol=null,kcol=null,scol=null;

/* ---------- storage ---------- */
const LS="debtors-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
const ALS="accounts-v1";
function accLoad(){try{return JSON.parse(localStorage.getItem(ALS)||"[]")}catch(e){return[]}}
function accSaveLocal(){try{localStorage.setItem(ALS,JSON.stringify(accounts))}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(debtors))}catch(e){}}
async function initStore(){
  try{assets=await claude.use("assets")}catch(e){}
  try{claude.use("mcp").then(m=>{mcpNs=m||null}).catch(()=>{})}catch(e){}
  try{claude.use("sample").then(f=>{sampleFn=f||null}).catch(()=>{})}catch(e){}
  try{
    const db=await claude.use("db");
    if(db){
      col=db.collection("debtors");mode="db";
      acol=db.collection("accounts");
      ccol=db.collection("cashtx");kcol=db.collection("cashcats");scol=db.collection("settings");hcol=db.collection("holdings");
      hcol.onSnapshot(snap=>{holdings=snap.docs.map(d=>({id:d.id,...d.data()}));if(loaded)safeRender()},()=>{});
      ccol.onSnapshot(snap=>{cashtx=snap.docs.map(d=>({id:d.id,...d.data()}));if(loaded)safeRender()},()=>{});
      kcol.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});cashcats=m;if(loaded)safeRender()},()=>{});
      scol.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});csettings=m.cash||{};invset=m.inv||{};themeFromDb(m.ui);if(loaded)safeRender()},()=>{});
      acol.onSnapshot(snap=>{
        accounts=snap.docs.map(d=>({id:d.id,...d.data()}));
        const ae=document.activeElement;
        if(!(ae&&ae.matches&&ae.matches("[data-aid],#na_name,#na_amt,#na_note")))render();
      },()=>{});
      col.onSnapshot(snap=>{
        debtors=snap.docs.map(d=>({id:d.id,...d.data()}));
        loaded=true;render();maybeNotify();setTimeout(backfillImgs,1500);setTimeout(iAutoTick,2500);
      },()=>{});
      return;
    }
  }catch(e){}

/* ---------- calculations ---------- */
const activeIn=(d,m)=>d.active!==false&&(!d.startMonth||d.startMonth<=m);
const principalAt=(d,m)=>Math.max(0,(+d.principal||0)+(d.changes||[]).filter(c=>c.month<=m).reduce((x,c)=>x+(+c.delta||0),0));
const interestFull=(d,m)=>principalAt(d,m)*(+d.rate>=0?+d.rate:10)/100;
const dueAmt=(d,m)=>{const o=(d.payments||[]).find(p=>p.month===m&&p.dueOverride!=null);return o?+o.dueOverride:interestFull(d,m)};
const groupName=d=>((d.group&&d.group.trim())||d.name.replace(/\s*\(.*\)\s*$/,"").trim()||d.name);
const gKey=d=>groupName(d).toLowerCase();
const RANK={paid:0,wait:1,part:2,soon:3,late:4};
const paidIn=(d,m)=>(d.payments||[]).filter(p=>p.month===m).reduce((s,p)=>s+(+p.amount||0),0);
const owed=(d,m)=>Math.max(0,dueAmt(d,m)-paidIn(d,m));
function arrears(d,m){
  const start=d.startMonth||m;if(start>m)return 0;
  let s=0,k=start,guard=0;
  while(k<=m&&guard++<600){s+=dueAmt(d,k)-paidIn(d,k);k=ymAdd(k,1)}
  return Math.max(0,s);
}
function status(d,m){
  const t=sod(new Date()),dd=dueDate(m,d.dueDay),due=dueAmt(d,m),paid=paidIn(d,m);
  if(due<=0)return{k:"paid",t:principalAt(d,m)<=0?"ปิดยอดแล้ว":"ไม่มีดอกเบี้ย"};
  if(paid>=due)return{k:"paid",t:"จ่ายแล้ว"};
  if(dd<t){const n=Math.round((t-dd)/86400000);return{k:"late",t:"เกินกำหนด "+n+" วัน",n}}
  if(dd.getTime()===t.getTime())return{k:"soon",t:"ครบกำหนดวันนี้"};
  if(dd.getTime()===addDays(t,1).getTime())return{k:"soon",t:"ครบกำหนดพรุ่งนี้"};
  if(paid>0)return{k:"part",t:"จ่ายบางส่วน"};
  return{k:"wait",t:"รอถึงกำหนด"};
}
const pill=s=>`<span class="pill p-${s.k==="soon"?"soon":s.k}">${s.t}</span>`;
const monthRows=m=>debtors.filter(d=>activeIn(d,m));
function totals(m){
  const rows=monthRows(m);
  const r={n:rows.length,principal:0,due:0,paid:0,out:0,arrears:0,late:0};
  rows.forEach(d=>{r.principal+=principalAt(d,m);r.due+=dueAmt(d,m);r.paid+=paidIn(d,m);r.out+=owed(d,m);r.arrears+=arrears(d,m);if(status(d,m).k==="late")r.late++});
  return r;
}

/* ---------- alerts ---------- */
function lateInfo(d,m,fallback){
  const t=sod(new Date());let k=d.startMonth||m,g=0;
  while(k<=m&&g++<600){if(dueAmt(d,k)-paidIn(d,k)>0.004){const dd=dueDate(k,d.dueDay);if(dd<t)return{days:Math.round((t-dd)/86400000),date:dd}}k=ymAdd(k,1)}
  return{days:Math.max(0,Math.round((t-fallback)/86400000)),date:fallback};
}
function alerts(){
  const t=sod(new Date()),tm=addDays(t,1),cur=ymOf(t),prev=ymAdd(cur,-1),ymT=ymOf(tm);
  const out={tomorrow:[],today:[],late:[]};
  debtors.forEach(d=>{
    if(d.active===false)return;
    if(activeIn(d,ymT)&&dueDate(ymT,d.dueDay).getTime()===tm.getTime()){const a=owed(d,ymT);if(a>0)out.tomorrow.push({d,ym:ymT,amt:a,date:tm})}
    if(activeIn(d,cur)&&dueDate(cur,d.dueDay).getTime()===t.getTime()){const a=owed(d,cur);if(a>0)out.today.push({d,ym:cur,amt:a,date:t})}
    if(activeIn(d,cur)){
      const passed=dueDate(cur,d.dueDay)<t;
      const a=passed?arrears(d,cur):(activeIn(d,prev)?arrears(d,prev):0);
      if(a>0){const fb=passed?dueDate(cur,d.dueDay):dueDate(prev,d.dueDay),li=lateInfo(d,passed?cur:prev,fb);out.late.push({d,ym:passed?cur:prev,amt:a,date:li.date,days:li.days})}
    }
  });
  out.late.sort((a,b)=>b.amt-a.amt);
  return out;
}
function msgFor(a,kind){
  const d=a.d;
  const when=kind==="tomorrow"?"พรุ่งนี้ ("+thDate(a.date)+")":kind==="today"?"วันนี้ ("+thDate(a.date)+")":"ที่ผ่านมา (ครบกำหนด "+thDate(a.date)+")";

}

function guideTips(){
  const out=[],add=(k,txt,a,t)=>out.push({k,txt,area:a,tab:t});
  try{
    const a=alerts(),t=totals(ym),sum=l=>l.reduce((s,x)=>s+x.amt,0);
    if(a.late.length)add("bad","ค้างชำระ "+a.late.length+" ราย รวม "+baht(sum(a.late))+" — ควรทวงวันนี้","debt","home");
    else if(a.today.length)add("warn","ครบกำหนดวันนี้ "+a.today.length+" ราย รวม "+baht(sum(a.today)),"debt","home");
    else if(a.tomorrow.length)add("warn","พรุ่งนี้ครบกำหนด "+a.tomorrow.length+" ราย รวม "+baht(sum(a.tomorrow)),"debt","home");
    if(t.due>0){
      const pct=Math.round(t.paid/t.due*100);
      if(pct>=100)add("good","เก็บดอกเบี้ยเดือนนี้ครบแล้ว "+baht(t.due),"debt","home");
      else if(!a.late.length&&t.out>0)add("warn","ยังไม่เก็บดอกเบี้ยเดือนนี้ "+baht(t.out)+" (เก็บได้ "+pct+"%)","debt","home");
    }
    if(!debtors.length)add("info","ยังไม่มีลูกหนี้ — เริ่มบันทึกเพื่อให้ระบบเตือนครบกำหนด","debt","home");
  }catch(e){}
  try{
    const txs=allCash().filter(t=>t.type!=="transfer"),mt=txs.filter(t=>t.date.slice(0,7)===ym);
    const inc=cSum(mt,"income"),exp=cSum(mt,"expense"),net=inc-exp;
    if(!mt.length)add("info","เดือนนี้ยังไม่จดรายรับรายจ่าย","cash","day");
    else{
      if(exp>inc&&exp>0)add("bad","เดือนนี้จ่ายมากกว่ารับ "+baht(exp-inc)+" — ควรลดรายจ่ายหรือเพิ่มรายรับ","cash","rep");
      else if(exp>0&&inc>0){
        const top=cRank(mt,"expense",cCats())[0];
        if(top&&top.v/exp>0.35)add("warn","หมวด “"+top.c.name+"” กิน "+Math.round(top.v/exp*100)+"% ของรายจ่ายรวม","cash","rep");
        if(net/inc<0.1)add("warn","เหลือสุทธิเพียง "+Math.round(net/inc*100)+"% ของรายรับ — เป้าออมควรอย่างน้อย 10%","cash","rep");
        else add("good","เหลือสุทธิ "+baht(net)+" ("+Math.round(net/inc*100)+"% ของรายรับ)","cash","rep");
      }
      if(qLimit()){const q=qMonth(txs,ym);if(q.over)add("warn","เกินวงเงินรายวัน "+q.over+" วัน (วงเงิน "+baht(qLimit())+"/วัน)","cash","rep")}
    }
  }catch(e){}
  try{
    if(holdings.length){
      const st=iStats(holdings),pct=st.cost>0?st.pl/st.cost*100:0,tot=st.val;
      const us=holdings.filter(h=>h.mkt==="us"),hasKey=fhKey()||tdKey();
      if(us.length&&!hasKey)add("warn","ยังไม่ใส่คีย์ Finnhub — ราคาหุ้นสหรัฐจะไม่อัปเดตเอง","inv","port");
      if(us.length&&hasKey){const old=us.filter(h=>h.priceAt&&Date.now()-new Date(h.priceAt).getTime()>3*86400000);if(old.length)add("warn","ราคา "+old.length+" ตัวเก่ากว่า 3 วัน — กดรีเฟรชราคา","inv","port")}
      if(tot>0){
        const big=holdings.map(h=>({h,v:hThb(h,(+h.qty||0)*(+h.price||0))})).sort((x,y)=>y.v-x.v)[0];
        if(big&&big.h&&big.v/tot>0.35)add("warn","ถือ "+big.h.sym+" หนัก "+Math.round(big.v/tot*100)+"% ของพอร์ต — ควรกระจายความเสี่ยง","inv","port");
        const cr=holdings.filter(h=>h.mkt==="crypto").reduce((s,h)=>s+hThb(h,(+h.qty||0)*(+h.price||0)),0);
        if(cr/tot>0.25)add("warn","คริปโต "+Math.round(cr/tot*100)+"% ของพอร์ต — ผันผวนสูง","inv","port");
      }
      if(st.cost>0)add(pct>=0?"good":"warn","พอร์ต"+(pct>=0?"กำไร ":"ขาดทุน ")+Math.abs(pct).toFixed(1)+"% ("+sgn(st.pl)+")","inv","port");
    }
  }catch(e){}
  const rank={bad:0,warn:1,info:2,good:3};
  return out.sort((a,b)=>rank[a.k]-rank[b.k]);
}

  const t=q.trim().toLowerCase();
  const all=monthRows(ym).filter(d=>!t||(d.name+" "+(d.note||"")+" "+groupName(d)).toLowerCase().includes(t));
  if(vmode==="person")fillPersons(all);else fillItems(all);

function fillItems(all){

  const rows=all.filter(d=>okF(status(d,ym).k)).sort((a,b)=>(a.dueDay||0)-(b.dueDay||0)||a.name.localeCompare(b.name,"th"));
  let tp=0,td=0,tc=0,to=0,ta=0;
  $("#rows").innerHTML=rows.length?rows.map(d=>{
    const pr=principalAt(d,ym),due=dueAmt(d,ym),paid=paidIn(d,ym),o=owed(d,ym),ar=arrears(d,ym);
    tp+=pr;td+=due;tc+=paid;to+=o;ta+=ar;

function fillPersons(all){
  $("#head").innerHTML=`<tr><th>ชื่อ</th><th class="num">ก้อน</th><th>วันครบกำหนด</th><th class="num">ยอดหลักรวม</th><th class="num">ดอกเบี้ย</th><th class="num">เก็บได้</th><th class="num">ค้างเดือนนี้</th><th class="num">ค้างสะสม</th><th>สถานะ</th></tr>`;
  const map=new Map();
  all.forEach(d=>{const k=gKey(d);if(!map.has(k))map.set(k,{name:groupName(d),items:[]});map.get(k).items.push(d)});
  const people=[...map.values()].map(g=>{
    const p={name:g.name,n:g.items.length,principal:0,due:0,paid:0,out:0,ar:0,days:[],worst:"paid",worstT:"จ่ายแล้ว"};
    g.items.forEach(d=>{
      p.principal+=principalAt(d,ym);p.due+=dueAmt(d,ym);p.paid+=paidIn(d,ym);p.out+=owed(d,ym);p.ar+=arrears(d,ym);
      p.days.push(dueDate(ym,d.dueDay).getDate());
      const st=status(d,ym);if(RANK[st.k]>RANK[p.worst]||(st.k==="late"&&p.worst==="late"&&st.n>(p.worstN||0))){p.worst=st.k;p.worstT=st.t;p.worstN=st.n||0}
    });
    p.days.sort((x,y)=>x-y);return p;
  }).filter(p=>okF(p.worst)).sort((a,b)=>b.principal-a.principal);
  let tp=0,td=0,tc=0,to=0,ta=0,tn=0;
  $("#rows").innerHTML=people.length?people.map(p=>{
    tp+=p.principal;td+=p.due;tc+=p.paid;to+=p.out;ta+=p.ar;tn+=p.n;
    return `<tr class="row" data-act="person" data-name="${esc(p.name)}" tabindex="0">
      <td class="name">${esc(p.name)}</td><td class="num">${p.n}</td><td>${p.days.join(", ")}</td>

      <td class="num">${p.out?money(p.out):"-"}</td><td class="num">${p.ar?money(p.ar):"-"}</td>
      <td>${pill({k:p.worst,t:p.worstT})}</td></tr>`}).join("")
    :`<tr><td colspan="9" class="empty">ไม่พบรายการ</td></tr>`;
  $("#foot").innerHTML=people.length?`<tr><td>รวม ${people.length} คน</td><td class="num">${tn}</td><td></td><td class="num">${money(tp)}</td><td class="num">${money(td)}</td><td class="num">${money(tc)}</td><td class="num">${money(to)}</td><td class="num">${money(ta)}</td><td></td></tr>`:"";
  $("#count").textContent="กดที่ชื่อเพื่อดูแต่ละก้อนของคนนั้น";
}

function pieHtml(){
  const rows=monthRows(ym).map(d=>({d,v:principalAt(d,ym),st:status(d,ym)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const tot=rows.reduce((x,r)=>x+r.v,0);
  if(!tot)return"";
  const grp=k=>k==="paid"?"paid":k==="late"?"late":k==="wait"?"wait":"soon";
  const COL={paid:"var(--good)",late:"var(--bad)",soon:"var(--warn)",wait:"var(--muted)"};
  const LAB={paid:"จ่ายแล้ว",soon:"ใกล้ครบ / จ่ายบางส่วน",wait:"รอถึงกำหนด",late:"เกินกำหนด"};
  const R=92,C=100;let a0=-Math.PI/2,sl="";
  rows.forEach((r,i)=>{
    const g=grp(r.st.k),fr=r.v/tot,a1=a0+fr*2*Math.PI;
    const attrs=`data-act="pie" data-id="${esc(r.d.id)}" data-name="${esc(r.d.name)}" data-v="${r.v}" data-p="${(fr*100).toFixed(1)}" data-st="${esc(r.st.t)}" style="fill:${COL[g]}"`;
    if(rows.length===1)sl+=`<circle cx="${C}" cy="${C}" r="${R}" ${attrs}><title>${esc(r.d.name)}</title></circle>`;
    else{const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);sl+=`<path d="M${C} ${C}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${fr>.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" ${attrs}><title>${esc(r.d.name)} ฿${money(r.v)}</title></path>`}
    a0=a1;
  });
  const sum={paid:[0,0],soon:[0,0],wait:[0,0],late:[0,0]};
  rows.forEach(r=>{const g=grp(r.st.k);sum[g][0]++;sum[g][1]+=r.v});
  const lg=["paid","soon","wait","late"].filter(g=>sum[g][0]).map(g=>`<div><i style="background:${COL[g]}"></i>${LAB[g]} ${sum[g][0]} ราย<span>฿${money(sum[g][1])} · ${Math.round(sum[g][1]/tot*100)}%</span></div>`).join("");
  return `<section class="panel"><h2>สัดส่วนหนี้แต่ละราย <small>ตามยอดหลัก · สีตามสถานะ</small></h2>
  <div class="pie"><svg viewBox="0 0 200 200" role="img" aria-label="แผนภูมิวงกลมสัดส่วนยอดหลักของลูกหนี้แต่ละราย สีตามสถานะ">${sl}</svg><div class="lg">${lg}<div style="border-top:1px solid var(--line);padding-top:8px;font-weight:600">รวม ${rows.length} ราย<span>฿${money(tot)}</span></div></div></div>
  <div class="pinfo" id="pieInfo">แตะส่วนของวงกลมเพื่อดูว่าเป็นของใคร</div></section>`;
}

function chart(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(ymAdd(ym,-i));
  const data=ms.map(m=>{const t=totals(m);return{m,due:t.due,paid:t.paid}});
  const max=Math.max(1,...data.map(x=>Math.max(x.due,x.paid)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const f=max/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p})();
  const W=640,H=230,L=52,R=12,T=14,B=30,iw=W-L-R,ih=H-T-B,gw=iw/data.length,bw=Math.min(34,gw/2-6);
  const y=v=>T+ih-(v/nice)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟแท่งเปรียบเทียบดอกเบี้ยที่ต้องเก็บและเก็บได้">`;
  [0,.25,.5,.75,1].forEach(f=>{const v=nice*f;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`});
  data.forEach((x,i)=>{
    const cx=L+gw*i+gw/2,[,mm]=ymParts(x.m);
    s+=`<rect class="b1" x="${cx-bw-2}" y="${y(x.due)}" width="${bw}" height="${Math.max(0,T+ih-y(x.due))}" rx="2"/><rect class="b2" x="${cx+2}" y="${y(x.paid)}" width="${bw}" height="${Math.max(0,T+ih-y(x.paid))}" rx="2"/><text x="${cx}" y="${H-10}" text-anchor="middle">${TH_S[mm-1]}</text>`;
    if(x.paid>0)s+=`<text x="${cx+2+bw/2}" y="${y(x.paid)-4}" text-anchor="middle">${money(x.paid)}</text>`;
  });
  return s+"</svg>";
}

async function saveAcc(a){
  if(mode==="db"&&acol){try{await acol.doc(a.id).set(clean(a))}catch(e){toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง")}}else accSaveLocal();
}
async function addAcc(){
  const name=$("#na_name").value.trim();
  if(!name){toast("กรุณากรอกชื่อบัญชี");$("#na_name").focus();return}
  const a={id:uid(),name,amount:+$("#na_amt").value||0,note:$("#na_note").value.trim(),updatedAt:todayIso(),ord:Date.now(),baseTs:Date.now()};
  accounts.push(a);await saveAcc(a);render();toast("เพิ่มบัญชีแล้ว");
}
async function delAcc(id){
  accounts=accounts.filter(x=>x.id!==id);
  if(mode==="db"&&acol){try{await acol.doc(id).delete()}catch(e){toast("ลบไม่สำเร็จ")}}else accSaveLocal();
  render();toast("ลบบัญชีแล้ว");
}

/* ---------- clear arrears ---------- */
const clearMonth=()=>{const t=ymOf(new Date());return ym<t?ym:t};
function clearPlan(d){
  const m=clearMonth(),items=[];
  let k=d.startMonth||m,g=0;
  while(k<=m&&g++<600){const r=dueAmt(d,k)-paidIn(d,k);if(r>0.004)items.push({month:k,amount:Math.round(r*100)/100});k=ymAdd(k,1)}
  return{m,items,total:items.reduce((x,i)=>x+i.amount,0)};
}
function clearBox(confirming){
  const d=cur(),el=$("#clearBox");if(!d||!el)return;
  const p=clearPlan(d);
  if(p.total<=0){el.innerHTML=`<div class="clearbar"><button class="btn go" disabled style="opacity:.55;cursor:default">ไม่มียอดค้าง</button></div>`;return}
  el.innerHTML=confirming
    ?`<div class="clearbar"><button class="btn go" data-act="clearDo">ยืนยันเคลียร์ ${money(p.total)} บาท</button><button class="btn" data-act="clearCancel">ยกเลิก</button></div><p class="hint" style="margin:0 0 6px">จะบันทึกรับเงินครบทุกงวดที่ค้างถึง${ymLabel(p.m)} (${p.items.length} งวด) ลงวันที่วันนี้ ลบทีละรายการได้ในประวัติรับเงิน</p>`
    :`<div class="clearbar"><button class="btn go" data-act="clearAsk">เคลียร์ยอดค้างทั้งหมด ${money(p.total)} บาท</button></div>`;
}

/* ---------- early payment ---------- */
let earlyFlag=false;
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=x=>{if(!x)return null;const[y,m,dd]=x.split("-").map(Number);return new Date(y,m-1,dd)};
function cycleMonth(d,pay){let m=ymOf(pay);if(dueDate(m,d.dueDay)<pay)m=ymAdd(m,1);return m}
function earlyFromFor(d,pay){return isoOf(dueDate(ymAdd(cycleMonth(d,pay),-1),d.dueDay))}
function earlyCalc(){
  const d=cur();if(!d)return null;
  const pay=parseISO($("#e_pay").value),from=parseISO($("#e_from").value);
  if(!pay||!from)return null;
  const month=cycleMonth(d,pay),full=interestFull(d,month);
  if(pay>=dueDate(month,d.dueDay))return{month,days:30,amt:Math.round(full*100)/100,txt:"วันที่จ่ายถึงหรือเลยวันครบกำหนดแล้ว คิดดอกเบี้ยเต็มงวด "+ymLabel(month)+" = "+money(full)+" บาท"};
  const days=Math.min(30,Math.max(0,Math.round((pay-from)/86400000)));
  const amt=Math.round(full/30*days*100)/100;
  return{month,days,amt,txt:`งวด ${ymLabel(month)}: ดอกเบี้ย ${money(full)} ÷ 30 × ${days} วัน = ${money(amt)} บาท`};
}
function earlyUpdate(){const el=$("#e_out");if(!el)return;const r=earlyCalc();el.textContent=r?r.txt:"กรุณาเลือกวันที่จ่ายและวันเริ่มนับ"}
function earlyUse(){
  const r=earlyCalc();if(!r){toast("กรุณาเลือกวันที่ให้ครบ");return}
  $("#p_month").value=r.month;$("#p_amt").value=r.amt;$("#p_date").value=$("#e_pay").value;
  $("#p_note").value=r.days<30?"จ่ายก่อนกำหนด "+r.days+" วัน":"";

}

async function mutate(id,key,fn){

  const v=fn(d[key]||[]);d[key]=v;
  if(mode==="db"){try{await col.doc(id).update({[key]:v})}catch(e){toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");return false}}else lsSave();

function shrink(file,max){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",.82)};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("load"))};
    im.src=u;
  });
}
function toDataUrl(src,max,q){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{try{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))}catch(e){rej(e)}};
    im.onerror=()=>rej(new Error("load"));im.src=src;
  });
}
async function upImage(file){
  if(!assets){toast("มุมมองนี้อัปโหลดรูปไม่ได้");return null}
  try{const b=await shrink(file,1600);const r=await assets.upload(b);
    let d="";try{const u=URL.createObjectURL(b);d=await toDataUrl(u,720,.62);URL.revokeObjectURL(u)}catch(e){}
    return{id:r.id,url:r.url,...(d?{d}:{})}}
  catch(e){toast("อัปโหลดรูปไม่สำเร็จ ลองรูปอื่นหรือลองใหม่");return null}
}

      if(!need)continue;
      const cache={};
      const get=async x=>{if(x.d)return x.d;if(cache[x.id]!==undefined)return cache[x.id];
        try{cache[x.id]=await toDataUrl(x.url||("/_blob/"+x.id),720,.62)}catch(e){cache[x.id]=""}return cache[x.id]};
      const ph=[];for(const x of d.photos||[]){const u=await get(x);ph.push(u&&!x.d?{...x,d:u}:x)}
      const pay=[];for(const x of d.payments||[]){if(x.slip&&!x.slip.d){const u=await get(x.slip);pay.push(u?{...x,slip:{...x.slip,d:u}}:x)}else pay.push(x)}

function tickFind(q,pref,only,lim){

    if(s===q)r=0;else if(s.startsWith(q))r=1;else if(n.startsWith(ql))r=2;else if(s.includes(q))r=3;else if(n.includes(ql))r=4;
    if(r>=0)out.push({...t,r:r*2+(t.m===pref?0:1)});
  });
  out.sort((a,b)=>a.r-b.r||a.sym.length-b.sym.length||a.sym.localeCompare(b.sym));

}

async function applySnap(o){
  const up=(arr,list,col,local)=>{(arr||[]).forEach(x=>{const i=list.findIndex(y=>y.id===x.id);if(i<0)list.push(x);else list[i]=x});return mode==="db"&&col?Promise.all((arr||[]).map(x=>col.doc(x.id).set(clean(x)).catch(()=>{}))):(local(),null)};
  await up(o.debtors,debtors,col,lsSave);
  await up(o.accounts,accounts,acol,accSaveLocal);
  await up(o.cashtx,cashtx,ccol,cSaveLocal);
  await up(o.holdings,holdings,hcol,hSaveLocal);
  const ck=o.cashcats||{};Object.keys(ck).forEach(k=>{cashcats[k]=ck[k];if(mode==="db"&&kcol)kcol.doc(k).set(ck[k]).catch(()=>{})});
  if(o.cashSettings)await cPut("set","cash",o.cashSettings);

  render();
}
let syncSet={};try{syncSet=JSON.parse(localStorage.getItem("sync-v1")||"{}")||{}}catch(e){syncSet={}}
const SYNF="megaapp-data.json",GH="https://api.github.com";
const syOn=()=>!!(syncSet.tok&&syncSet.gist);
const sySave=()=>{try{localStorage.setItem("sync-v1",JSON.stringify(syncSet))}catch(e){}};
const syH=()=>({Authorization:"Bearer "+syncSet.tok,Accept:"application/vnd.github+json","Content-Type":"application/json"});
const syHash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h+":"+s.length};
function syTokRead(){
  const el=document.querySelector("#sy_tok");
  const v=el&&el.value?el.value.trim():"";
  if(v&&v!==syncSet.tok){syncSet.tok=v;sySave()}
  return (syncSet.tok||"").trim();
}
async function ghFind(){
  const r=await fetch(GH+"/gists?per_page=100&_="+Date.now(),{headers:syH(),cache:"no-store"});
  if(!r.ok)throw new Error(syErr(r.status));
  const arr=await r.json();
  const g=(Array.isArray(arr)?arr:[]).find(x=>x.files&&x.files[SYNF]);
  if(!g)return "";
  syncSet.gist=g.id;sySave();return g.id;
}
function syErr(s){
  if(s===401)return "โทเคนไม่ถูกต้อง/หมดอายุ — สร้างใหม่ที่ github.com/settings/tokens (scope gist)";
  if(s===404)return "ไม่พบ gist — กด “ส่งขึ้นคลาวด์” เพื่อสร้างใหม่";
  if(s===403)return "ติดสิทธิ์ (403) — ตรวจว่าโทเคนมี scope gist";
  return "เชื่อมต่อ GitHub ไม่ได้ ("+s+")";
}
async function ghPush(txt){
  if(!syncSet.tok)throw new Error("ยังไม่ได้ใส่โทเคน");
  const body=f=>JSON.stringify({description:"สมุดลูกหนี้ – ข้อมูลซิงก์",public:false,files:{[SYNF]:{content:f}}});
  let r;
  if(!syncSet.gist){
    r=await fetch(GH+"/gists",{method:"POST",headers:syH(),body:body(txt)});
    if(!r.ok)throw new Error(syErr(r.status));
    const j=await r.json();syncSet.gist=j.id;sySave();
  }else{
    r=await fetch(GH+"/gists/"+syncSet.gist,{method:"PATCH",headers:syH(),body:body(txt)});
    if(r.status===404){syncSet.gist="";sySave();return ghPush(txt)}
    if(!r.ok)throw new Error(syErr(r.status));
  }
  syncSet.lastPush=new Date().toISOString();syncSet.lastHash=syHash(txt);sySave();
}
async function ghPull(){
  if(!syncSet.tok||!syncSet.gist)throw new Error("ยังไม่ได้เชื่อมต่อ");
  const r=await fetch(GH+"/gists/"+syncSet.gist,{headers:syH()});
  if(!r.ok)throw new Error(syErr(r.status));
  const j=await r.json(),f=j.files&&j.files[SYNF];
  if(!f)return null;
  if(f.truncated&&f.raw_url){const rr=await fetch(f.raw_url);if(!rr.ok)throw new Error("อ่านไฟล์ซิงก์ไม่ได้");return JSON.parse(await rr.text())}
  return JSON.parse(f.content);
}
async function syPush(quiet){
  if(!syTokRead()){if(!quiet)toast("ใส่โทเคน GitHub ก่อน");return}
  try{
    if(!syncSet.gist)await ghFind();
    await ghPush(JSON.stringify(snapObj()));
    if(!quiet)toast("ส่งข้อมูลขึ้นคลาวด์แล้ว");
    render();
  }catch(e){if(!quiet)toast("ซิงก์ไม่สำเร็จ: "+e.message)}
}

  if(/เดบิต|debit/i.test(s))return"card";
  return"cash";
}

function idTs(id){
  const m=/^d([0-9a-z]{8})/.exec(String(id||""));
  if(!m)return 0;
  const t=parseInt(m[1],36);
  return(t>1.5e12&&t<4e12)?t:0;
}
const accSorted2=()=>accSorted();
function interestWalletId(){
  if(csettings&&csettings.interestWallet&&accounts.some(a=>a.id===csettings.interestWallet))return csettings.interestWallet;
  const d=accounts.find(a=>a.name==="ดอก");
  if(d)return d.id;
  const f=accSorted()[0];
  return f?f.id:null;
}
function walletOpts(sel){return accSorted().map(a=>`<option value="${esc(a.id)}"${a.id===sel?" selected":""}>${esc(a.name)}</option>`).join("")}
function allCash(){
  const out=cashtx.map(t=>({...t}));
  const iw=interestWalletId();
  debtors.forEach(d=>{
    (d.payments||[]).forEach(p=>out.push({id:"pay:"+d.id+":"+p.id,virtual:true,did:d.id,month:p.month,type:"income",amount:+p.amount||0,date:p.date||(p.month+"-01"),undated:!p.date,cat:"i_int",wallet:p.wallet||iw,note:"ดอกเบี้ย "+d.name,ts:idTs(p.id)}));
    (d.changes||[]).forEach(c=>{const dl=+c.delta||0;out.push({id:"chg:"+d.id+":"+c.id,virtual:true,did:d.id,month:c.month,type:dl>0?"expense":"income",amount:Math.abs(dl),date:c.date||(c.month+"-01"),undated:!c.date,cat:dl>0?"e_lend":"i_repay",wallet:c.wallet||iw,note:(dl>0?"ให้ยืมเพิ่ม ":"รับคืนต้น ")+d.name,ts:idTs(c.id)})});
  });
  return out;
}
function accBal(a,txs){
  let b=+a.amount||0;const base=+a.baseTs||0;
  (txs||allCash()).forEach(t=>{
    if((+t.ts||0)<=base)return;
    const x=+t.amount||0;
    if(t.type==="income"&&t.wallet===a.id)b+=x;
    else if(t.type==="expense"&&t.wallet===a.id)b-=x;
    else if(t.type==="transfer"){if(t.wallet===a.id)b-=x;if(t.to===a.id)b+=x}
  });
  return b;
}
/* ยอดคงเหลือของกระเป๋า ณ สิ้นเดือน m (เดือนปัจจุบันหรืออนาคต = ยอดปัจจุบัน) คำนวณย้อนจากยอดปัจจุบัน */
function accBalAt(a,txs,m){
  const end=m+"-31",base=+a.baseTs||0;
  let b=accBal(a,txs);
  (txs||[]).forEach(t=>{
    if((+t.ts||0)<=base||t.date<=end)return;
    const x=+t.amount||0;
    if(t.type==="income"&&t.wallet===a.id)b-=x;
    else if(t.type==="expense"&&t.wallet===a.id)b+=x;
    else if(t.type==="transfer"){if(t.wallet===a.id)b+=x;if(t.to===a.id)b-=x}
  });
  return b;
}
function cashTotal(){const tx=allCash();return accounts.reduce((s,a)=>s+accBal(a,tx),0)}

}

const qLimit=()=>+csettings.dailyLimit>0?+csettings.dailyLimit:0;
const qWarn=()=>[70,80,90].includes(+csettings.warnPct)?+csettings.warnPct:80;
const qExcl=()=>Array.isArray(csettings.exclCats)?csettings.exclCats:["e_debt","e_lend"];
function qSpent(txs,date){const ex=qExcl();return txs.reduce((x,t)=>t.type==="expense"&&t.date===date&&!ex.includes(t.cat)?x+(+t.amount||0):x,0)}
function qState(spent){
  const L=qLimit();if(!L)return null;
  const left=L-spent,k=spent>L+0.004?"over":spent>=L-0.004?"full":spent/L*100>=qWarn()?"near":"ok";
  return{k,left,pct:Math.min(100,spent/L*100),t:{over:"เกินวงเงิน 😠",full:"ครบวงเงิน",near:"ใกล้ครบวงเงิน 😐",ok:"ใช้ไม่ถึงวงเงิน 😊"}[k]};
}
const qPill=st=>st?`<span class="pill ${st.k==="over"?"p-late":st.k==="full"?"p-soon":st.k==="near"?"p-part":"p-paid"}">${st.t}</span>`:"";
const qColor=k=>k==="over"?"var(--bad)":k==="ok"?"var(--good)":"var(--warn)";
function qMonth(txs,m){
  const ex=qExcl(),by={};
  txs.forEach(t=>{if(t.type==="expense"&&t.date&&t.date.slice(0,7)===m&&!ex.includes(t.cat))by[t.date]=(by[t.date]||0)+(+t.amount||0)});
  const r={spent:0,over:0,full:0,days:Object.keys(by).length};
  Object.keys(by).forEach(d=>{r.spent+=by[d];const k=qState(by[d]).k;if(k==="over")r.over++;else if(k==="full")r.full++});
  const td=todayIso(),[yy,mm]=m.split("-").map(Number),dimm=new Date(yy,mm,0).getDate();
  r.elapsed=m<td.slice(0,7)?dimm:m===td.slice(0,7)?+td.slice(8,10):0;
  r.under=Math.max(0,r.elapsed-r.over-r.full);
  return r;
}
function qCard(txs,isNow){
  const L=qLimit();

    <div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(st.pct)}" aria-label="ใช้ไปเท่าไรของวงเงินวันนี้"><i style="width:${st.pct}%;--q:${qColor(st.k)}"></i></div>
    <div class="qnum"><span>ใช้ไป <b>${baht(sp)}</b></span><span>${st.left>=0?`เหลือ <b>${baht(st.left)}</b>`:`<span class="bad">😠 เกินวงเงิน <b>${baht(-st.left)}</b></span>`}</span></div>`;
  }else h+=`<div class="qh"><b>วงเงินรายวัน ${baht(L)}</b><button class="gear" data-act="c-quota">ตั้งค่า</button></div>`;

  return h;

function cBars(el,o){
  const w=Math.max(260,el.clientWidth),h=o.h||170,pl=36,pr=4,pt=8,pb=22,iw=w-pl-pr,ih=h-pt-pb,n=o.labels.length;
  const top=Math.max(1,...o.a,...o.b),p10=Math.pow(10,Math.floor(Math.log10(top))),f=top/p10,mx=(f<=1?1:f<=2?2:f<=5?5:10)*p10;
  const slot=iw/n,bw=Math.max(2,Math.min(20,slot*.34)),cp=v=>{v=Math.abs(v);return v>=1e6?+(v/1e6).toFixed(1)+"M":v>=1e3?+(v/1e3).toFixed(1)+"k":Math.round(v)};
  let s=`<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria)}">`;
  [0,.5,1].forEach(fr=>{const y=pt+ih-ih*fr;s+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3.5}" text-anchor="end">${cp(mx*fr)}</text>`});
  for(let i=0;i<n;i++){
    const cx=pl+slot*i+slot/2,ha=o.a[i]/mx*ih,hb=o.b[i]/mx*ih;
    if(ha>0)s+=`<rect class="cb-i" x="${cx-bw-.5}" y="${pt+ih-ha}" width="${bw}" height="${ha}" rx="1.5"/>`;
    if(hb>0)s+=`<rect class="cb-e" x="${cx+.5}" y="${pt+ih-hb}" width="${bw}" height="${hb}" rx="1.5"/>`;
    if(o.show(i))s+=`<text class="${i===o.hi?"hi":""}" x="${cx}" y="${h-6}" text-anchor="middle">${o.labels[i]}</text>`;
  }
  el.innerHTML=s+"</svg>";
}
function cDonut(el,rank){
  const tot=rank.reduce((s,r)=>s+r.v,0),r=60,sw=24,C=2*Math.PI*r;let off=0;
  const segs=rank.slice(0,6).map(x=>({v:x.v,color:x.c.color})),rest=rank.slice(6).reduce((s,x)=>s+x.v,0);
  if(rest>0)segs.push({v:rest,color:"#8A97A5"});
  const cp=v=>v>=1e6?+(v/1e6).toFixed(2)+"M":v>=1e3?+(v/1e3).toFixed(1)+"k":Math.round(v);
  let s=`<svg width="168" height="168" viewBox="0 0 168 168" role="img" aria-label="สัดส่วนตามหมวดหมู่"><circle cx="84" cy="84" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="${sw}"/>`;
  segs.forEach(g=>{const len=g.v/tot*C;s+=`<circle cx="84" cy="84" r="${r}" fill="none" stroke="${g.color}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len-(segs.length>1?1.5:0))} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 84 84)"/>`;off+=len});
  s+=`<text x="84" y="80" text-anchor="middle" style="fill:var(--muted);font:11px var(--f-body)">รวม</text><text x="84" y="101" text-anchor="middle" style="fill:var(--fg);font:500 19px var(--f-num)">${cp(tot)}</text></svg>`;
  el.innerHTML=s;
}

function sqData(file,size){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2,c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(im,sx,sy,m,m,0,0,size,size);URL.revokeObjectURL(u);res(c.toDataURL("image/png"))}catch(e){rej(e)}};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("load"))};im.src=u;
  });
}

    <div><div class="xl">สี</div><div class="sw" id="x_sw"></div><div class="row" style="display:flex;gap:8px;align-items:center;margin-top:8px"><span class="hint">เลือกสีเอง</span><input type="color" id="x_col" value="${esc(/^#[0-9a-f]{6}$/i.test(d.color)?d.color:"#2f6fde")}" style="width:52px;min-height:40px;padding:2px"></div></div>
    <div class="err" id="x_err" role="alert"></div>
    <div class="acts2">${edit&&(!isDef||cashcats[id])?`<button class="btn danger" id="x_del">${isDef?"คืนค่าเดิม":"ลบ"}</button>`:""}<button class="btn primary" id="x_save">บันทึก</button></div>
  </div></div></div>`;
  const rf=()=>{
    $("#x_pv").style.setProperty("--c",d.color);$("#x_pv").innerHTML=ico(d.icon,30);
    $("#x_ig").innerHTML=PICK.map(k=>`<button type="button" class="ibtn${k===d.icon?" on":""}" style="--c:${d.color}" data-i="${k}" aria-label="${k}">${ico(k,22)}</button>`).join("");
    $("#x_sw").innerHTML=CK_COLORS.map(c=>`<button type="button" class="${c===d.color?"on":""}" style="--c:${c}" data-c="${c}" aria-label="สี ${c}"></button>`).join("");
  };
  rf();
  $("#x_ig").addEventListener("click",e=>{const b=e.target.closest("button");if(b){d.icon=b.dataset.i;rf()}});
  $("#x_sw").addEventListener("click",e=>{const b=e.target.closest("button");if(b){d.color=b.dataset.c;$("#x_col").value=b.dataset.c;rf()}});
  $("#x_col").addEventListener("input",e=>{d.color=e.target.value;rf()});
  $("#x_eg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){d.icon="e:"+b.dataset.e;$("#x_em").value=b.dataset.e;rf()}});
  $("#x_emok").addEventListener("click",()=>{const v=$("#x_em").value.trim();if(!v){$("#x_err").textContent="พิมพ์หรือวางอีโมจิก่อน";return}$("#x_err").textContent="";d.icon="e:"+[...v].slice(0,3).join("");rf()});
  $("#x_img").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
    try{d.icon="img:"+await sqData(f,96);$("#x_err").textContent="";rf()}catch(x){$("#x_err").textContent="เปิดรูปนี้ไม่ได้ ลองรูปอื่น"}});
  $("#x_save").addEventListener("click",async()=>{
    const n=$("#x_cn").value.trim();
    if(!n){$("#x_err").textContent="ใส่ชื่อหมวด";return}
    const nid=id||uid();
    closeSheet();await cPut("cats",nid,{name:n,kind:d.kind,icon:d.icon,color:d.color});render();toast("บันทึกหมวดแล้ว");
    if(back)cOpenTx(back.id,null,{...back.draft,cat:nid});
  });
  const dl=$("#x_del");
  if(dl)dl.addEventListener("click",async()=>{
    if(!dl.dataset.ok){dl.dataset.ok="1";dl.textContent="ยืนยัน";return}
    closeSheet();await cDel("cats",id);render();toast(isDef?"คืนค่าเดิมแล้ว":"ลบหมวดแล้ว");
  });
}

function cAct(act,el){
  switch(act){
    case"c-add":cOpenTx(null,el.dataset.t);break;
    case"c-edit":cOpenTx(el.dataset.id);break;
    case"c-quota":openQuota();break;
    case"c-catopen":cOpenCatList(el.dataset.id,el.dataset.k);break;
    case"c-wf":cwf=el.dataset.id;render();break;
    case"c-rk":crk=el.dataset.id;render();break;
    case"c-wnew":cOpenWallet();break;
    case"c-wedit":cOpenWallet(el.dataset.id);break;
    case"c-cnew":cOpenCat(null,el.dataset.id);break;
    case"c-cedit":cOpenCat(el.dataset.id);break;
  }
}
function renderChrome(){
  const cash=area==="cash",inv=area==="inv";
  $("#h1").textContent=inv?"พอร์ตลงทุน":cash?"สมุดรับจ่าย":"สมุดลูกหนี้";
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.area===area)));
  const tabs=inv?[["port","พอร์ต"]]:cash?[["day","รายวัน"],["rep","รายงาน"],["wal","กระเป๋า"],["cat","หมวดหมู่"]]:[["home","ภาพรวมและแจ้งเตือน"],["list","รายชื่อลูกหนี้"],["report","รายงานสรุป"],["cash","เงินทุน"]];
  const sel=inv?"port":cash?ctab:tab;
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===sel}">${l}</button>`).join("");
  $("#addBtn").hidden=cash||inv;
  $("#fab").hidden=!(inv||(cash&&(ctab==="day"||ctab==="rep")));
  $("#fab").dataset.act=inv?"i-add":"c-add";
  $("#fab").innerHTML=ico("plus",22)+"<span>"+(inv?"เพิ่มสินทรัพย์":"เพิ่มรายการ")+"</span>";
  $(".month").hidden=inv||(cash&&(ctab==="wal"||ctab==="cat"));
  $("#main").classList.toggle("cm",cash||inv);
}


/* ---------- events ---------- */
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="sy_auto"){syncSet.auto=t.checked;sySave();toast(t.checked?"เปิดส่งข้อมูลอัตโนมัติ":"ปิดส่งข้อมูลอัตโนมัติ")}
  else if(t.id==="i_auto"){await invPut({auto:t.checked});if(t.checked){iFails=0;iRefresh(true)}}
  else if(t.id==="i_fh"||t.id==="i_td"){await invPut({[t.id==="i_fh"?"fh":"td"]:t.value.trim()});iFails=0;render();if(t.value.trim()){toast("บันทึกคีย์แล้ว กำลังดึงราคา");iRefresh(true)}else toast("ลบคีย์แล้ว")}
  else if(t.id==="i_fx"){const v=+t.value;if(v>0){await invPut({fx:v});render()}}
  else if(t.id==="rs_file"&&t.files&&t.files[0]){const f=t.files[0];t.value="";restoreAll(f)}
  else if(t.id==="i_shot"&&t.files&&t.files[0]){const f=t.files[0];t.value="";iShot(f)}
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(!el){return}
  const act=el.dataset.act;
  if(act.startsWith("c-")){cAct(act,el);return}
  if(act.startsWith("i-")){iAct(act,el);return}
  // backdrop click closes only when the backdrop itself was hit
  if((act==="closeSheet"||act==="closeText")&&el.classList.contains("sheet-back"))return; // คลิกพื้นหลังไม่ปิดหน้าต่าง ต้องกดปุ่ม ปิด/บันทึก เท่านั้น
  if((act==="closeSheet"||act==="closeText"||act==="closeLb")&&el.classList.contains("sheet-back")&&e.target!==el)return;
  switch(act){
    case"open":openSheet(el.dataset.id,el.dataset.pay);break;
    case"closeSheet":closeSheet();break;
    case"theme":theme=el.dataset.t;applyTheme(theme);saveTheme();document.querySelectorAll(".thm").forEach(b=>b.classList.toggle("on",b.dataset.t===theme));break;
    case"pie":pieInfo(el);break;
    case"closeText":$("#overlay").innerHTML="";break;
    case"closeLb":$("#lightbox").innerHTML="";break;
    case"earlyUse":earlyUse();break;
    case"stab":setSheetTab(el.dataset.k);break;
    case"gtip":guideGo(el);break;
    case"gmore":guideOpen=!guideOpen;renderGuide();break;
    case"gdismiss":{
      const t=guideCur[+el.dataset.i];if(!t)break;
      gSeenLoad();if(!guideSeen.includes(t.txt))guideSeen.push(t.txt);gSeenSave();
      const row=el.closest(".g"),last=guideCur.length<=1;
      if(last||!row){guideFade(()=>renderGuide())}
      else{row.classList.add("out");setTimeout(()=>renderGuide(),185)}
      break}
    case"gclose":guideFade(()=>{guideHidden=true;guidePeek=false;renderGuide()});break;
    case"gbadge":{const vis=!$("#guide").hidden;if(vis)guideFade(()=>{guideHidden=true;guidePeek=false;renderGuide()});else{guideHidden=false;guidePeek=true;renderGuide()}break}
    case"clearAsk":clearBox(true);break;
    case"clearCancel":clearBox();break;
    case"clearDo":clearAll();break;
    case"setview":vmode=el.dataset.k;render();break;
    case"person":q=el.dataset.name;vmode="item";render();break;
    case"addChange":addChange();break;
    case"delChange":delChange(el.dataset.cid);break;
    case"addAcc":addAcc();break;
    case"delAcc":el.textContent="ยืนยันลบ";el.dataset.act="doDelAcc";break;
    case"doDelAcc":delAcc(el.dataset.aid);break;
    case"view":viewImg(el.dataset.kind,el.dataset.pid);break;
    case"delImg":el.textContent="ยืนยันลบรูป";el.dataset.act="doDelImg";break;
    case"doDelImg":deleteImg(el.dataset.kind,el.dataset.pid);break;
    case"filter":filter=el.dataset.k;render();break;
    case"saveDebtor":saveDebtor();break;
    case"addPay":addPay();break;
    case"delPay":delPay(el.dataset.pid);break;
    case"askDelete":el.outerHTML=`<span id="delBtn" class="hint">ลบถาวร ยืนยัน? </span><button class="btn danger" data-act="doDelete">ยืนยันลบ</button><button class="btn" data-act="cancelDelete">ยกเลิก</button>`;break;
    case"cancelDelete":{const s=$("#delBtn");if(s){s.nextElementSibling.remove();s.nextElementSibling.remove();s.outerHTML=`<button class="btn danger" data-act="askDelete" id="delBtn">ลบลูกหนี้</button>`}break}
    case"doDelete":{const id=editId;closeSheet();await remove(id);toast("ลบลูกหนี้แล้ว");break}
    case"copymsg":{const a=alerts();const list=[...a[el.dataset.kind]||[]];const hit=list.find(x=>x.d.id===el.dataset.id);if(hit)copy(msgFor(hit,el.dataset.kind));break}
    case"notify":try{const r=await Notification.requestPermission();if(r==="granted"){toast("เปิดแจ้งเตือนแล้ว");maybeNotify()}else toast("เบราว์เซอร์ไม่อนุญาตการแจ้งเตือน");render()}catch(err){toast("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน")}break;
    case"csvMonth":csvMonth();break;
    case"csvAll":csvAll();break;
    case"csvCash":csvCash();break;
    case"csvInv":csvInv();break;
    case"backupAll":backupAll();break;
    case"sy-save":{const v=(($("#sy_tok")||{}).value||"").trim();syncSet.tok=v;if(!v)syncSet.gist="";sySave();render();toast(v?"บันทึกโทเคนแล้ว — กด “ส่งขึ้นคลาวด์” หรือ “ดึงจากคลาวด์”":"ลบโทเคนแล้ว");break}
    case"sy-push":syPush();break;
    case"sy-pull":syPull();break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#lightbox").innerHTML)$("#lightbox").innerHTML="";else if($("#overlay").innerHTML)$("#overlay").innerHTML=""}
  if(e.key==="Enter"&&e.target.matches("tr.row")){e.target.click()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="search"){q=e.target.value;fillRows()}
  if(e.target.id==="f_prin"||e.target.id==="f_rate")calcHint();
  if(e.target.id==="e_pay"){const d=cur(),pay=parseISO(e.target.value);if(d&&pay){$("#e_from").value=earlyFromFor(d,pay)}earlyUpdate()}
  if(e.target.id==="e_from")earlyUpdate();
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="x_iw"){await cPut("set","cash",{...csettings,interestWallet:t.value});render();toast("ตั้งกระเป๋ารับดอกเบี้ยแล้ว");return}
  if(t.dataset&&t.dataset.aid&&t.dataset.f){
    const a=accounts.find(x=>x.id===t.dataset.aid);if(!a)return;
    const f=t.dataset.f;a[f]=f==="amount"?(+t.value||0):t.value.trim();if(f==="amount")a.baseTs=Date.now();a.updatedAt=todayIso();
    await saveAcc(a);refreshCash();return;
  }
  if(t.id==="p_month"){const d=cur();if(d)$("#p_amt").value=owed(d,t.value)||"";earlyFlag=false;const tg=$("#earlyTag");if(tg)tg.hidden=true;payHint()}
  if(t.id==="ph_in"){
    const d=cur(),files=[...t.files];t.value="";
    if(!d||!files.length)return;
    toast("กำลังอัปโหลดรูป…");
    const add=[];for(const f of files){const r=await upImage(f);if(r)add.push(r)}
    if(add.length&&await mutate(d.id,"photos",a=>[...a,...add])){photos();toast("เพิ่มรูปแล้ว")}
  }
  if(t.dataset&&t.dataset.slipfor){
    const d=cur(),pid=t.dataset.slipfor,f=t.files[0];t.value="";
    if(!d||!f)return;
    toast("กำลังอัปโหลดสลิป…");
    const s=await upImage(f);if(!s)return;
    if(await mutate(d.id,"payments",a=>a.map(p=>p.id===pid?{...p,slip:s}:p))){payList();toast("แนบสลิปแล้ว")}
  }
});
$("#themeBtn").addEventListener("click",openTheme);
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||area==="inv")return;if(area==="cash"){ctab=b.dataset.tab;try{localStorage.setItem("debt-ctab",ctab)}catch(x){}}else{tab=b.dataset.tab;try{localStorage.setItem("debt-tab",tab)}catch(x){}}render()});
$(".modes").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;area=b.dataset.area;try{localStorage.setItem("debt-area",area)}catch(x){}iFails=0;render();if(area==="inv")setTimeout(iAutoTick,300);window.scrollTo(0,0)});
$("#prev").addEventListener("click",()=>{ym=ymAdd(ym,-1);render()});
$("#next").addEventListener("click",()=>{ym=ymAdd(ym,1);render()});
$("#addBtn").addEventListener("click",()=>openSheet(null));

render();
initStore();
})();
</script>
